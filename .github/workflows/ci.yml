name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: docker build -t mcp-code-mode .
      - name: Smoke test the Compose deployment
        env:
          GATEWAY_TOKEN: ci-compose-fixture-token-0123456789
        run: |
          printf '[]\n' > config.json
          trap 'docker compose logs --no-color; docker compose down -v --timeout 2' EXIT
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 60
          curl --fail --retry 5 --retry-delay 1 --retry-all-errors --max-time 5 -o /dev/null http://127.0.0.1:3001/
          curl --fail --retry 5 --retry-delay 1 --retry-all-errors --max-time 5 \
            -H "Authorization: Bearer ${GATEWAY_TOKEN}" http://127.0.0.1:3001/api/catalog
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: docker build -t mcp-code-mode-admin .

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix apps/admin
      - run: npm run build
      - run: npm run build --prefix apps/admin
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-admin-ui.mjs
        env:
          UI_SCREENSHOTS_DIR: browser-screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: admin-screenshots
          path: browser-screenshots
          retention-days: 7
