services:
  gateway:
    build: .
    environment:
      GATEWAY_TOKEN: "${GATEWAY_TOKEN:-}"
      OAUTH_CONFIG: "${OAUTH_CONFIG:-}"
      ADMIN_SUBJECTS: "${ADMIN_SUBJECTS:-}"
      UPSTREAM_CREDENTIALS: "${UPSTREAM_CREDENTIALS:-[]}"
      UPSTREAM_OAUTH_CONFIG: "${UPSTREAM_OAUTH_CONFIG:-}"
      UPSTREAM_OAUTH_KEY: "${UPSTREAM_OAUTH_KEY:-}"
      UPSTREAM_OAUTH_REDIRECT_URL: "${UPSTREAM_OAUTH_REDIRECT_URL:-}"
      CONFIG_PATH: /config/config.json
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - type: bind
        source: ./config.json
        target: /config/config.json
        read_only: true
        bind:
          create_host_path: false
      - state:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 128
  admin:
    build: ./apps/admin
    network_mode: "service:gateway"
    environment:
      GATEWAY_URL: http://127.0.0.1:3000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
volumes:
  state:
